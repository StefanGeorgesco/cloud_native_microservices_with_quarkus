quarkus.datasource.db-kind=postgresql

# Base locale (dev). En test, aucune URL : Dev Services lance un conteneur Postgres dédié.
%dev.quarkus.datasource.username=bob
%dev.quarkus.datasource.password=bob
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/smartbar-bo-dev


# Port de production
%prod.quarkus.http.port=7070
# Base de production (prod)
%prod.quarkus.datasource.username=bob
%prod.quarkus.datasource.password=bob
%prod.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:6000/smartbar-bo-prod
quarkus.hibernate-orm.schema-management.strategy=drop-and-create

# Optionnel : version de l'image utilisée par Dev Services
# %test.quarkus.datasource.devservices.image-name=postgres:17
