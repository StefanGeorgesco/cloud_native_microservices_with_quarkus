quarkus.datasource.db-kind=postgresql

# Base locale (dev + prod). En test, aucune URL : Dev Services lance un conteneur Postgres dédié.
%dev,prod.quarkus.datasource.username=bob
%dev,prod.quarkus.datasource.password=bob
%dev,prod.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/smartbar-bo

quarkus.hibernate-orm.schema-management.strategy=drop-and-create

